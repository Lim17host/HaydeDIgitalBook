<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Flipbook - The Contemporary World</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f1015;
            color: #ffffff;
        }

        .modal-container {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #232630 0%, #12141c 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 28px;
            background: rgba(15, 16, 21, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            z-index: 50;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 600;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            box-shadow: 0 0 10px #3b82f6;
        }

        /* Reader Viewport */
        .modal-body {
            flex: 1;
            width: 100%;
            height: calc(100vh - 65px);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: auto;
            padding: 40px;
        }

        #loading {
            position: absolute;
            color: #94a3b8;
            font-size: 16px;
            font-weight: 500;
        }

        /* Zoom Scaling Area */
        .zoom-viewport {
            transition: transform 0.2s ease-out;
            transform-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3D Flipbook Shadow & Book Spine Styling */
        .flipbook-wrapper {
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            overflow: hidden;
            background: #e2e8f0;
        }

        .page {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Book Spine Shadow Effect */
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.08);
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        /* Controls Panel */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px; /* Dati: 12px */
            background: rgba(15, 16, 21, 0.92);
            padding: 6px 14px; /* Dati: 10px 24px */
            border-radius: 30px; /* Dati: 40px */
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        .btn {
             background: #2563eb;
            color: white;
            border: none;
            padding: 5px 10px; /* Dati: 8px 16px */
            border-radius: 15px;
            cursor: pointer;
            font-size: 11px; /* Dati: 13px */
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 3px 8px rgba(37, 99, 235, 0.3);
        }

        .btn-zoom {
            background: #334155;
            box-shadow: none;
            padding: 5px 9px; /* Dati: 8px 14px */
        }

        .page-info {
            color: #cbd5e1;
            font-size: 11px; /* Dati: 13px */
            font-weight: 500;
            min-width: 70px; /* Dati: 90px */
            text-align: center;
        }

        .divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 4px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

    <div class="modal-container">
        <div class="modal-header">
            <span class="modal-title">The Contemporary World</span>
        </div>
        
        <div class="modal-body">
            <div id="loading">Inihahanda ang 3D Book Pages...</div>
            
            <div class="zoom-viewport" id="zoom-viewport">
                <div id="book" class="flipbook-wrapper" style="display:none;"></div>
            </div>

            <div class="controls" id="controls" style="display: none;">
                <button class="btn" id="prev-btn">‹ Prev</button>
                <span class="page-info" id="page-num">Page 1</span>
                <button class="btn" id="next-btn">Next ›</button>
                
                <div class="divider"></div>
                
                <button class="btn btn-zoom" id="zoom-out">− Zoom</button>
                <span class="page-info" id="zoom-val" style="min-width:45px;">100%</span>
                <button class="btn btn-zoom" id="zoom-in">+ Zoom</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const pdfUrl = 'UNIT-1-5.pdf';
        let pageFlip = null;
        let currentZoom = 1.0;

        async function initFlipbook() {
            try {
                const loadingEl = document.getElementById('loading');
                const bookContainer = document.getElementById('book');
                const controlsEl = document.getElementById('controls');

                // 1. Fetch PDF Document
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                const numPages = pdf.numPages;

                // 2. Aspect Ratio Computation
                const firstPage = await pdf.getPage(1);
                const originalViewport = firstPage.getViewport({ scale: 1.0 });
                const pdfWidth = originalViewport.width;
                const pdfHeight = originalViewport.height;

                const targetHeight = 650;
                const targetWidth = (pdfWidth / pdfHeight) * targetHeight;

                // 3. Render High-Resolution Pages into Canvas Elements
                for (let i = 1; i <= numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 2.5 }); // High Quality HD Render

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.appendChild(canvas);
                    bookContainer.appendChild(pageDiv);
                }

                // 4. Initialize 3D PageFlip Engine
                pageFlip = new St.PageFlip(bookContainer, {
                    width: targetWidth,
                    height: targetHeight,
                    size: 'fixed',
                    minWidth: 300,
                    maxWidth: 1000,
                    minHeight: 400,
                    maxHeight: 1200,
                    maxShadowOpacity: 0.8,
                    showCover: true,
                    mobileScrollSupport: false
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                // Update Page Number Indicator
                pageFlip.on('flip', (e) => {
                    document.getElementById('page-num').innerText = `Page ${e.data + 1} of ${numPages}`;
                });

                loadingEl.style.display = 'none';
                bookContainer.style.display = 'block';
                controlsEl.style.display = 'flex';
                document.getElementById('page-num').innerText = `Page 1 of ${numPages}`;

            } catch (error) {
                console.error('Error loading PDF flipbook:', error);
                document.getElementById('loading').innerText = 'Nagkaroon ng problema sa pag-load ng PDF.';
            }
        }

        // Navigation Controls
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (pageFlip) pageFlip.flipPrev();
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (pageFlip) pageFlip.flipNext();
        });

        // Smooth Zooming System
        const zoomViewport = document.getElementById('zoom-viewport');
        const zoomValSpan = document.getElementById('zoom-val');

        function updateZoom() {
            zoomViewport.style.transform = `scale(${currentZoom})`;
            zoomValSpan.innerText = `${Math.round(currentZoom * 100)}%`;
        }

        document.getElementById('zoom-in').addEventListener('click', () => {
            if (currentZoom < 1.8) {
                currentZoom += 0.15;
                updateZoom();
            }
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            if (currentZoom > 0.7) {
                currentZoom -= 0.15;
                updateZoom();
            }
        });

        initFlipbook();
    </script>
</body>
</html>
