<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Flipbook - The Contemporary World</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #eab308;
            color: #ffffff;
        }

        .modal-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: radial-gradient(circle at center, #fbbf24 0%, #d97706 100%);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            background: rgba(15, 16, 21, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            z-index: 50;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .modal-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
        }

        .modal-body {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 10px 20px 75px 20px; 
        }

        #loading {
            position: absolute;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .zoom-viewport {
            transition: transform 0.2s ease-out;
            transform-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 35px 35px rgba(0, 0, 0, 0.45));
        }

        .flipbook-wrapper {
            background: transparent;
            border-radius: 4px;
        }

        /* Center Spine Shadows */
        .page {
            background-color: #fcfbf9;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page.--left::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 35px;
            height: 100%;
            background: linear-gradient(to left, rgba(0, 0, 0, 0.22) 0%, rgba(0, 0, 0, 0.05) 40%, rgba(0, 0, 0, 0) 100%);
            pointer-events: none;
            z-index: 5;
        }

        .page.--right::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 35px;
            height: 100%;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.22) 0%, rgba(0, 0, 0, 0.05) 40%, rgba(0, 0, 0, 0) 100%);
            pointer-events: none;
            z-index: 5;
        }

        .page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
            pointer-events: none;
            z-index: 4;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 16, 21, 0.85);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover { 
            background: #ffffff; 
            color: #0f1015;
        }

        .btn-zoom {
            background: transparent;
            border: none;
            padding: 6px 10px;
        }

        .page-info {
            color: #f1f5f9;
            font-size: 12px;
            font-weight: 500;
            min-width: 85px;
            text-align: center;
        }

        .divider {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 4px;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@0.6.5/dist/js/page-flip.browser.js"></script>
</head>
<body>

    <div class="modal-container">
        <div class="modal-header" id="modal-header">
            <span class="modal-title">The Contemporary World</span>
        </div>
        
        <div class="modal-body" id="modal-body">
            <div id="loading">Loading PDF file...</div>
            
            <div class="zoom-viewport" id="zoom-viewport">
                <div id="book" class="flipbook-wrapper" style="display:none;"></div>
            </div>

            <div class="controls" id="controls" style="display: none;">
                <button class="btn" id="prev-btn">‹ Prev</button>
                <span class="page-info" id="page-num">Page 1</span>
                <button class="btn" id="next-btn">Next ›</button>
                
                <div class="divider"></div>
                
                <button class="btn btn-zoom" id="zoom-out">− Zoom</button>
                <span class="page-info" id="zoom-val" style="min-width:45px;">100%</span>
                <button class="btn btn-zoom" id="zoom-in">+ Zoom</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const pdfUrl = 'UNIT-1-5.pdf';
        
        let pageFlip = null;
        let currentZoom = 1.0;

        async function initFlipbook() {
            const loadingEl = document.getElementById('loading');
            const bookContainer = document.getElementById('book');
            const controlsEl = document.getElementById('controls');
            const modalBody = document.getElementById('modal-body');

            try {
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                const numPages = pdf.numPages;

                const firstPage = await pdf.getPage(1);
                const originalViewport = firstPage.getViewport({ scale: 1.0 });
                
                const availableHeight = modalBody.clientHeight - 30; 
                const targetHeight = availableHeight;
                const targetWidth = (originalViewport.width / originalViewport.height) * targetHeight;

                for (let i = 1; i <= numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 3.0 }); 

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = `page ${i % 2 === 0 ? '--left' : '--right'}`;
                    pageDiv.appendChild(canvas);
                    bookContainer.appendChild(pageDiv);
                }

                pageFlip = new St.PageFlip(bookContainer, {
                    width: targetWidth,
                    height: targetHeight,
                    size: 'fixed',
                    minWidth: 300,
                    maxWidth: 2000,
                    minHeight: 400,
                    maxHeight: 2000,
                    maxShadowOpacity: 0.85,
                    showCover: true,
                    drawShadow: true,
                    flippingTime: 1000,
                    usePortrait: false,
                    startZIndex: 0,
                    mobileScrollSupport: false
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                pageFlip.on('flip', (e) => {
                    document.getElementById('page-num').innerText = `Page ${e.data + 1} of ${numPages}`;
                });

                loadingEl.style.display = 'none';
                bookContainer.style.display = 'block';
                controlsEl.style.display = 'flex';
                document.getElementById('page-num').innerText = `Page 1 of ${numPages}`;

            } catch (error) {
                console.error('Error loading PDF flipbook:', error);
                loadingEl.innerHTML = '⚠️ **Failed to load PDF.**<br><small>Please make sure the PDF filename is correct.</small>';
            }
        }

        document.getElementById('prev-btn').addEventListener('click', () => pageFlip && pageFlip.flipPrev());
        document.getElementById('next-btn').addEventListener('click', () => pageFlip && pageFlip.flipNext());

        const zoomViewport = document.getElementById('zoom-viewport');
        const zoomValSpan = document.getElementById('zoom-val');

        function updateZoom() {
            zoomViewport.style.transform = `scale(${currentZoom})`;
            zoomValSpan.innerText = `${Math.round(currentZoom * 100)}%`;
        }

        document.getElementById('zoom-in').addEventListener('click', () => {
            if (currentZoom < 1.7) { currentZoom += 0.15; updateZoom(); }
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            if (currentZoom > 0.7) { currentZoom -= 0.15; updateZoom(); }
        });

        initFlipbook();
    </script>
</body>
</html>
