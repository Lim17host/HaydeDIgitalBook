<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Thesis Book - Readable HD Reader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f1015;
            color: #ffffff;
            touch-action: none; 
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 16, 21, 0.85);
            color: #e2e8f0;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            text-align: center;
            width: max-content;
            max-width: 90vw;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(8, 9, 12, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(12px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            width: 94vw;
            height: 94vh;
            background: radial-gradient(circle at center, #232630 0%, #12141c 100%);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            background: #151821;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 50;
            width: 100%;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            box-shadow: 0 0 10px #3b82f6;
        }

        .close-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: #ef4444;
            color: white;
            transform: scale(1.05);
        }

        .modal-body {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 30px 20px 100px 20px;
            overflow-y: auto;
            overflow-x: auto;
            touch-action: pan-x pan-y;
        }

        #loading {
            position: absolute;
            top: 45%;
            color: #94a3b8;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
        }

        .page-wrapper {
            position: relative;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            transition: transform 0.2s ease;
            display: none;
            transform-origin: top center;
            margin-top: 10px;
        }

        .page-number-overlay {
            position: absolute;
            bottom: 12px;
            right: 18px;
            background: transparent;
            color: #475569;
            padding: 0;
            border-radius: 0;
            font-size: 13px;
            font-weight: 600;
            font-family: Georgia, 'Times New Roman', serif;
            border: none;
            pointer-events: none;
            z-index: 5;
            box-shadow: none;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto !important;
        }

        .controls {
            position: fixed;
            bottom: 35px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 16, 21, 0.95);
            padding: 10px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            z-index: 60;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-zoom {
            background: #334155;
            box-shadow: none;
            padding: 8px 12px;
        }

        .btn-zoom:hover {
            background: #475569;
        }

        .page-info {
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
            min-width: 100px;
            text-align: center;
        }

        .divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 4px;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

    <div class="instructions">Click/Tap and drag to rotate • Tap book to read</div>
    <div id="canvas-container"></div>

    <div class="modal-overlay" id="pdf-modal">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title">The Contemporary World</div>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>

            <div class="modal-body" id="modal-body">
                <div id="loading">Inihahanda ang malinaw na pahina...</div>

                <div class="page-wrapper" id="page-wrapper">
                    <canvas id="pdf-canvas"></canvas>
                    <span class="page-number-overlay" id="page-overlay-num">1</span>
                </div>

                <div class="controls" id="controls" style="display: none;">
                    <button class="btn" id="prev-btn">‹ Prev</button>
                    <span class="page-info" id="page-num">Page 1</span>
                    <button class="btn" id="next-btn">Next ›</button>
                    
                    <div class="divider"></div>
                    
                    <button class="btn btn-zoom" id="zoom-out">− Zoom</button>
                    <button class="btn btn-zoom" id="zoom-in">+ Zoom</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        function createPaperTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#f2efe9';
            ctx.fillRect(0, 0, 256, 256);

            ctx.fillStyle = '#d4ceb8';
            for (let i = 0; i < 256; i += 3) {
                ctx.fillRect(0, i, 256, 1);
            }

            const gradient = ctx.createLinearGradient(0, 0, 15, 0);
            gradient.addColorStop(0, 'rgba(0,0,0,0.18)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 256, 256);

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 4);
            return texture;
        }

        // 2. 3D Book & Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 5.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
        dirLight.position.set(4, 8, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0001;
        scene.add(dirLight);

        const fillLight = new THREE.PointLight(0x3b82f6, 0.3, 10);
        fillLight.position.set(-4, -2, 3);
        scene.add(fillLight);

        const starsCount = 2500;
        const starsGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 120;
            starPositions[i + 1] = (Math.random() - 0.5) * 120;
            starPositions[i + 2] = (Math.random() - 0.5) * 120;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.85 });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        function createCoverWithCrease(imagePath, isBackCover = false) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const texture = new THREE.CanvasTexture(canvas);

            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imagePath;

            img.onload = () => {
                canvas.width = img.width || 1024;
                canvas.height = img.height || 1400;

                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                const creaseX = isBackCover ? canvas.width * 0.92 : canvas.width * 0.08; 
                const grooveWidth = canvas.width * 0.035;

                const darkGradient = ctx.createLinearGradient(creaseX - grooveWidth, 0, creaseX + grooveWidth, 0);
                darkGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
                darkGradient.addColorStop(0.4, 'rgba(0, 0, 0, 0.45)');
                darkGradient.addColorStop(0.6, 'rgba(0, 0, 0, 0.6)');
                darkGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = darkGradient;
                ctx.fillRect(creaseX - grooveWidth, 0, grooveWidth * 2, canvas.height);

                const highlightX = isBackCover ? creaseX - (grooveWidth * 2) : creaseX + grooveWidth;
                const highlightGradient = ctx.createLinearGradient(highlightX, 0, highlightX + grooveWidth, 0);
                highlightGradient.addColorStop(0, isBackCover ? 'rgba(255, 255, 255, 0)' : 'rgba(255, 255, 255, 0.35)');
                highlightGradient.addColorStop(1, isBackCover ? 'rgba(255, 255, 255, 0.35)' : 'rgba(255, 255, 255, 0)');

                ctx.fillStyle = highlightGradient;
                ctx.fillRect(highlightX, 0, grooveWidth, canvas.height);

                texture.needsUpdate = true;
            };

            return texture;
        }

        const textureLoader = new THREE.TextureLoader();
        const frontCover = createCoverWithCrease('front-cover.jpg', false);
        const backCover = createCoverWithCrease('back-cover.jpg', true);
        const spineCover = textureLoader.load('spine-cover.jpg');
        const paperEdgeTexture = createPaperTexture();

        const paperMaterial = new THREE.MeshStandardMaterial({ map: paperEdgeTexture, roughness: 0.8, metalness: 0.1 });

        const materials = [
            paperMaterial,
            new THREE.MeshStandardMaterial({ map: spineCover, roughness: 0.4 }),
            paperMaterial,
            paperMaterial,
            new THREE.MeshStandardMaterial({ map: frontCover, roughness: 0.3 }),
            new THREE.MeshStandardMaterial({ map: backCover, roughness: 0.3 })
        ];

        const bookGroup = new THREE.Group();
        const geometry = new THREE.BoxGeometry(2, 2.8, 0.28);
        const book = new THREE.Mesh(geometry, materials);
        book.castShadow = true;
        book.receiveShadow = true;
        bookGroup.add(book);

        bookGroup.rotation.y = Math.PI / 4;
        scene.add(bookGroup);

        const shadowPlaneGeo = new THREE.PlaneGeometry(10, 10);
        const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.4 });
        const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.position.y = -1.5;
        shadowPlane.receiveShadow = true;
        scene.add(shadowPlane);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointermove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(book);
            document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
        });

        const modal = document.getElementById('pdf-modal');
        const closeModalBtn = document.getElementById('close-modal');

        const pdfFile = 'THE-CONTEMPORARY-WORLD.pdf';

        let pdfDoc = null;
        let pageNum = 1;
        let currentZoom = 1.0;
        let isRendering = false;

        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const pageWrapper = document.getElementById('page-wrapper');
        const loadingEl = document.getElementById('loading');
        const controlsEl = document.getElementById('controls');
        const pageNumSpan = document.getElementById('page-num');
        const pageOverlayNum = document.getElementById('page-overlay-num');

        async function renderPage(num) {
            isRendering = true;
            const page = await pdfDoc.getPage(num);

            const viewport = page.getViewport({ scale: 2.8 });
            const outputScale = window.devicePixelRatio || 1;

            canvas.width = Math.floor(viewport.width * outputScale);
            canvas.height = Math.floor(viewport.height * outputScale);
            canvas.style.width = Math.floor(viewport.width * 0.45) + "px";
            canvas.style.height = "auto";

            const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

            await page.render({ canvasContext: ctx, transform: transform, viewport: viewport }).promise;
            isRendering = false;

            pageNumSpan.innerText = `Page ${num} of ${pdfDoc.numPages}`;
            pageOverlayNum.innerText = num;
        }

        function applyZoom() {
            pageWrapper.style.transform = "scale(" + currentZoom + ")";
            var extraHeight = pageWrapper.offsetHeight * (currentZoom - 1);
            pageWrapper.style.marginBottom = currentZoom > 1 ? (extraHeight + 40) + "px" : "40px";
        }

        async function initPDF() {
            if (pdfDoc) {
                renderPage(pageNum);
                return;
            }

            try {
                loadingEl.style.display = 'block';
                loadingEl.innerText = 'Preparing clear page...';
                pageWrapper.style.display = 'none';

                pageNum = 1;
                currentZoom = 1.0;

                pdfDoc = await pdfjsLib.getDocument(pdfFile).promise;
                await renderPage(pageNum);

                loadingEl.style.display = 'none';
                pageWrapper.style.display = 'block';
                controlsEl.style.display = 'flex';
                applyZoom();
            } catch (err) {
                loadingEl.innerText = 'Error loading document. Tiyaking "THE-CONTEMPORARY-WORLD.pdf" ang filename ng PDF sa folder.';
                console.error(err);
            }
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (pageNum <= 1 || isRendering) return;
            pageNum--;
            renderPage(pageNum);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (pageNum >= pdfDoc.numPages || isRendering) return;
            pageNum++;
            renderPage(pageNum);
        });

        document.getElementById('zoom-in').addEventListener('click', () => {
            if (currentZoom >= 2.0) return;
            currentZoom += 0.15;
            applyZoom();
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            if (currentZoom <= 0.7) return;
            currentZoom -= 0.15;
            applyZoom();
        });

        let pointerStartX = 0;
        let pointerStartY = 0;

        window.addEventListener('pointerdown', (e) => {
            pointerStartX = e.clientX;
            pointerStartY = e.clientY;
        });

        window.addEventListener('pointerup', (e) => {
            if (modal.classList.contains('active')) return;

            const diffX = Math.abs(e.clientX - pointerStartX);
            const diffY = Math.abs(e.clientY - pointerStartY);

            if (diffX < 12 && diffY < 12) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(book);

                if (intersects.length > 0) {
                    modal.classList.add('active');
                    initPDF();
                }
            }
        });

        function closeModal() {
            modal.classList.remove('active');
        }

        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            if (typeof starField !== 'undefined') {
                starField.rotation.y += 0.0004;
                starField.rotation.x += 0.0001;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
